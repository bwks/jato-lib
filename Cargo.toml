[package]
name = "jato"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "SSH connections to hosts and network devices"
repository = "https://github.com/bwks/jato-lib"
readme = "README.md"
keywords = ["ssh", "sftp", "network", "automation"]
categories = ["network-programming"]

[features]
# Use a terminal as `ssh` does: TerminalPrompter and Session::interactive_shell.
terminal = ["dep:crossterm", "dep:crossterm_winapi", "dep:rpassword", "tokio/signal", "tokio/sync"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"], optional = true }
hmac = "0.13"
regex = "1"
rpassword = { version = "7.3", optional = true }
russh = "0.65"
sha1 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tracing = "0.1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = { version = "0.9.1", optional = true }

[dev-dependencies]
# The stack test polls a connection from a small thread while the workers run russh's tasks.
tokio = { version = "1", features = ["rt-multi-thread"] }
