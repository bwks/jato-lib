# Check every pull request and push to main.
#
# Linux runs the checks from AGENTS.md (format, lint, unit and container tests) with and
# without the optional features, so code behind a feature flag is built and tested too.
# Windows lints and runs the unit tests with every feature, for the Windows-only code: the
# console modes, raw mode and resize polling of the `terminal` feature, and the agent pipe.
# The container tests need Linux containers, so they run on Linux only. The release workflow
# runs its own checks before tagging.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint with all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Unit tests with all features
        run: cargo test --all-features

      - name: Build the test SSH server image
        run: docker build -t jato-test-sshd tests/sshd

      - name: Container tests
        run: cargo test --all-features --test integration -- --ignored

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint with all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests with all features
        run: cargo test --all-features --lib
